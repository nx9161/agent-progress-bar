# CI: build, test, contract, audit. No publish steps — releases are owner-gated.
name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/*/package-lock.json

      - name: Install (mcp-server)
        working-directory: packages/mcp-server
        run: npm ci

      - name: Install (cli)
        working-directory: packages/cli
        run: npm ci

      - name: Typecheck + build (mcp-server)
        working-directory: packages/mcp-server
        run: npm run build

      - name: Typecheck + build (cli)
        working-directory: packages/cli
        run: npm run build

      - name: Contract tests
        run: node scripts/contract-test.js

      - name: Skill install test (hermetic, fake HOME)
        run: bash skills/agent-progress/test/install.test.sh

      - name: Stdout-purity test
        working-directory: packages/mcp-server
        run: npm test
        # ^ covers ALL mcp-server test files (test/*.test.ts), not just stdout-purity

      - name: Inspector smoke test
        run: |
          npx -y @modelcontextprotocol/inspector@2.11.0 --cli node packages/mcp-server/dist/index.js --method tools/list
          npx -y @modelcontextprotocol/inspector@2.11.0 --cli node packages/mcp-server/dist/index.js --method tools/call --tool-name report_progress --tool-arg task_id=ci:smoke --tool-arg percent=42 --tool-arg eta_seconds=30 --tool-arg stage="CI smoke"

      - name: CLI tests (dashboard server)
        working-directory: packages/cli
        run: npm test
        # ^ covers the dashboard-server hermetic tests (loopback bind, token
        #   gating, CORS, SSE replay) — test/*.test.ts

      - name: Build demo page
        run: node scripts/build-demo.js

      - name: Build dashboard page
        # Self-verification is the CSP gate: the build re-hashes the output
        # and throws on any mismatch (script + document style + widget
        # shadow style). Fails loudly on drift.
        run: node scripts/build-dashboard.js

      - name: Audit gate (mcp-server)
        working-directory: packages/mcp-server
        run: npm audit --audit-level=high

      - name: Audit gate (cli)
        working-directory: packages/cli
        run: npm audit --audit-level=high

  pages:
    # Public demo front door. Static dist/ only — the honesty labels and
    # trademark footer ride along with the build, unchanged.
    if: github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build demo page
        run: node scripts/build-demo.js
      - name: Publish dist/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
